# Formato do PDF. Copiado para _quarto-pdf.yml por scripts/gerar_estrutura.py.
format:
  pdf:
    documentclass: scrbook
    classoption: [oneside, open=any, parskip=half, numbers=noenddot]
    papersize: a4
    fontsize: 11pt
    pdf-engine: xelatex
    toc-depth: 2
    toc-title: Sumário
    number-depth: 3
    colorlinks: true
    fig-format: pdf
    keep-tex: false
    filters:
      - filtros/refs-pendentes.lua
      - filtros/caixas-pdf.lua
    include-in-header:
      - file: tex/preambulo.tex
      - file: tex/macros.tex
