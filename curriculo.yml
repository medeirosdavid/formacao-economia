# =============================================================================
# CURRÍCULO — fonte única da estrutura do livro
# -----------------------------------------------------------------------------
# Tudo o que descreve a estrutura (partes, capítulos, nível, pré-requisitos,
# leituras, tópicos planejados e status) mora AQUI. Depois de editar, rode:
#
#     python scripts/gerar_estrutura.py
#
# O script cria os capítulos que ainda não existem (nunca sobrescreve texto
# escrito), atualiza o cabeçalho de cada capítulo, as listas de capítulos do
# site e do PDF, as páginas de abertura das partes e o plano mestre.
#
# Campos de cada capítulo
#   id       código estável (ÁREA-NÍVELnn); vira o rótulo #sec-<id em minúsculas>
#   titulo   título do capítulo
#   nivel    G (graduação) | M (mestrado) | D (doutorado)
#   prereq   ids de capítulos que devem vir antes
#   leituras chaves de referencias.bib
#   topicos  seções planejadas (viram o roteiro do capítulo-esboço)
#   status   planejado | rascunho | revisao | completo   (padrão: planejado)
#
# Para ADICIONAR um tópico: acrescente um item na parte certa, com um id novo
# (ex.: MAC-M14). A ordem no arquivo é a ordem no livro.
# =============================================================================

titulo: "Formação em Economia"
subtitulo: "Macroeconomia, Finanças e Econometria — da graduação ao doutorado"
autor: "David Medeiros"

niveis:
  G: Graduação
  M: Mestrado
  D: Doutorado

trilhas:
  - nome: "Base quantitativa"
    descricao: "Matemática, probabilidade e computação até o nível de mestrado — o mínimo para ler qualquer outra parte com conforto."
    capitulos: [MAT-G01, MAT-G05, MAT-G06, MAT-G07, EST-G01, EST-G02, EST-G03, EST-G05, EST-G06, CMP-G01, CMP-G02, MAT-M01, MAT-M02, MAT-M03, EST-M02, EST-M03]
  - nome: "Graduação completa"
    descricao: "Todos os capítulos de nível G, na ordem do livro."
    filtro_nivel: G
  - nome: "Núcleo de macro quantitativa"
    descricao: "Do equilíbrio recursivo aos agentes heterogêneos, com as ferramentas que o caminho exige."
    capitulos: [MAT-D02, MAT-D03, MIC-M04, MAC-M01, MAC-M04, MAC-M06, MAC-M07, CMP-M04, CMP-D01, MAC-M10, MAC-M11, MAC-D01, MAC-D02, MAC-D03]
  - nome: "Macroeconometria"
    descricao: "Séries temporais, identificação e estimação de modelos estruturais."
    capitulos: [ECM-M02, ECM-M09, ECM-M10, ECM-M11, ECM-D01, ECM-D02, ECM-D03, ECM-D04, ECM-D05, ECM-D09]
  - nome: "Apreçamento de ativos"
    descricao: "Do fator estocástico de desconto aos modelos de estrutura a termo e macro-finanças."
    capitulos: [MIC-M02, FIN-M02, FIN-M03, FIN-M04, FIN-M05, FIN-M06, FIN-M07, FIN-M08, FIN-D01, FIN-D03, FIN-D04]

partes:

  # ---------------------------------------------------------------------------
  - id: MAT
    titulo: "Matemática"
    pasta: "01-matematica"
    descricao: >-
      Ferramentas de análise, álgebra linear, otimização e dinâmica usadas no
      resto do livro. Do cálculo de graduação à programação dinâmica estocástica.
    capitulos:
      - id: MAT-G01
        titulo: "Lógica, conjuntos e métodos de demonstração"
        nivel: G
        prereq: []
        leituras: [simon1994, lima1989]
        topicos: ["Proposições, conectivos e quantificadores", "Conjuntos, relações e funções", "Cardinalidade", "Demonstração direta, contrapositiva, por absurdo e por indução"]
      - id: MAT-G02
        titulo: "Números reais, sequências e séries"
        nivel: G
        prereq: [MAT-G01]
        leituras: [lima1989, rudin1976]
        topicos: ["Axioma do supremo", "Sequências e limites", "Subsequências e Bolzano–Weierstrass", "Sequências de Cauchy", "Séries e critérios de convergência", "Séries geométricas e valor presente"]
      - id: MAT-G03
        titulo: "Funções de uma variável: limites, continuidade e derivadas"
        nivel: G
        prereq: [MAT-G02]
        leituras: [simon1994, sydsaeter2016]
        topicos: ["Limites e continuidade", "Valor intermediário e Weierstrass", "Derivada e regras de derivação", "Teorema do valor médio", "Fórmula de Taylor", "Concavidade, elasticidade e aplicações"]
      - id: MAT-G04
        titulo: "Integração e aplicações"
        nivel: G
        prereq: [MAT-G03]
        leituras: [simon1994, sydsaeter2016]
        topicos: ["Integral de Riemann", "Teorema fundamental do cálculo", "Técnicas de integração", "Integrais impróprias", "Regra de Leibniz", "Aplicações: excedentes, valor presente contínuo"]
      - id: MAT-G05
        titulo: "Álgebra linear I: vetores, matrizes e sistemas lineares"
        nivel: G
        prereq: [MAT-G01]
        leituras: [strang2016, simon1994]
        topicos: ["Vetores e o espaço $\\mathbb{R}^n$", "Operações com matrizes", "Eliminação gaussiana e posto", "Determinante e inversa", "Independência linear, base e dimensão", "Aplicação: modelo insumo-produto"]
      - id: MAT-G06
        titulo: "Cálculo em várias variáveis"
        nivel: G
        prereq: [MAT-G03, MAT-G05]
        leituras: [simon1994, sydsaeter2016]
        topicos: ["Funções de $\\mathbb{R}^n$ em $\\mathbb{R}$", "Derivadas parciais, gradiente e diferencial", "Regra da cadeia", "Matriz hessiana", "Funções homogêneas e teorema de Euler", "Integrais múltiplas"]
      - id: MAT-G07
        titulo: "Otimização: sem restrições e com restrições de igualdade"
        nivel: G
        prereq: [MAT-G06]
        leituras: [simon1994, sundaram1996]
        topicos: ["Condições de primeira e segunda ordem", "Concavidade e ótimos globais", "Método de Lagrange", "Interpretação dos multiplicadores", "Hessiana orlada", "Aplicações: consumidor e firma"]
      - id: MAT-G08
        titulo: "Equações em diferenças e equações diferenciais lineares"
        nivel: G
        prereq: [MAT-G04, MAT-G05]
        leituras: [simon1994, sydsaeter2016]
        topicos: ["Equações em diferenças de 1ª e 2ª ordem", "Equações diferenciais de 1ª e 2ª ordem", "Estado estacionário e estabilidade", "Sistemas lineares", "Aplicações: teia de aranha, Solow"]
      - id: MAT-M01
        titulo: "Análise real em $\\mathbb{R}^n$ e espaços métricos"
        nivel: M
        prereq: [MAT-G02, MAT-G06]
        leituras: [ok2007, rudin1976, delafuente2000]
        topicos: ["Espaços métricos e normados", "Abertos, fechados e compactos", "Completude", "Continuidade e continuidade uniforme", "Teorema de Weierstrass em espaços métricos", "Conexidade"]
      - id: MAT-M02
        titulo: "Álgebra linear II: autovalores, decomposições e formas quadráticas"
        nivel: M
        prereq: [MAT-G05]
        leituras: [strang2016, delafuente2000]
        topicos: ["Autovalores e autovetores", "Diagonalização e teorema espectral", "Formas quadráticas e definição de matrizes", "Decomposições: Cholesky, QR, SVD", "Projeções ortogonais", "Cálculo matricial"]
      - id: MAT-M03
        titulo: "Convexidade e otimização com restrições de desigualdade"
        nivel: M
        prereq: [MAT-G07, MAT-M01]
        leituras: [sundaram1996, delafuente2000]
        topicos: ["Conjuntos e funções convexas", "Quase-concavidade", "Teoremas de separação", "Condições de Kuhn–Tucker", "Qualificação de restrições", "Dualidade"]
      - id: MAT-M04
        titulo: "Estática comparativa: função implícita, envelope e teorema do máximo"
        nivel: M
        prereq: [MAT-M03]
        leituras: [sundaram1996, simon1994]
        topicos: ["Teorema da função implícita", "Teorema do envelope", "Correspondências e continuidade", "Teorema do máximo de Berge", "Estática comparativa monótona"]
      - id: MAT-M05
        titulo: "Correspondências e teoremas de ponto fixo"
        nivel: M
        prereq: [MAT-M01, MAT-M04]
        leituras: [ok2007, sundaram1996]
        topicos: ["Teorema do ponto fixo de Banach", "Teorema de Brouwer", "Teorema de Kakutani", "Ponto fixo de Tarski", "Aplicações a existência de equilíbrio"]
      - id: MAT-M06
        titulo: "Sistemas dinâmicos: estabilidade, linearização e diagramas de fase"
        nivel: M
        prereq: [MAT-G08, MAT-M02]
        leituras: [delafuente2000, acemoglu2009]
        topicos: ["Sistemas lineares em tempo discreto e contínuo", "Linearização e teorema de Hartman–Grobman", "Pontos de sela e variedades estáveis", "Diagramas de fase", "Condições de Blanchard–Kahn"]
      - id: MAT-D01
        titulo: "Cálculo das variações e controle ótimo"
        nivel: D
        prereq: [MAT-M03, MAT-M06]
        leituras: [kamien1991, acemoglu2009]
        topicos: ["Equação de Euler–Lagrange", "Condições de transversalidade", "Princípio do máximo de Pontryagin", "Hamiltoniano a valor corrente", "Horizonte infinito", "Aplicação: Ramsey"]
      - id: MAT-D02
        titulo: "Programação dinâmica determinística"
        nivel: D
        prereq: [MAT-M04, MAT-M05]
        leituras: [stokey1989, ljungqvist2018]
        topicos: ["Problema sequencial e equação de Bellman", "Princípio da otimalidade", "Operador de Bellman e contração", "Condições de Blackwell", "Propriedades da função valor", "Teorema do envelope de Benveniste–Scheinkman"]
      - id: MAT-D03
        titulo: "Programação dinâmica estocástica"
        nivel: D
        prereq: [MAT-D02, EST-D01]
        leituras: [stokey1989, ljungqvist2018]
        topicos: ["Choques markovianos", "Bellman estocástico", "Funções política e equação de Euler estocástica", "Distribuições invariantes", "Convergência fraca"]
      - id: MAT-D04
        titulo: "Espaços de funções e operadores"
        nivel: D
        prereq: [MAT-M01, MAT-M02]
        leituras: [ok2007, stokey1989]
        topicos: ["Espaços de Banach e de Hilbert", "Operadores lineares", "O espaço $L^2$ e projeções", "Teorema de representação de Riesz", "Aplicações a econometria e dinâmica"]

  # ---------------------------------------------------------------------------
  - id: EST
    titulo: "Probabilidade e Estatística"
    pasta: "02-probabilidade-estatistica"
    descricao: >-
      Da probabilidade elementar à teoria da medida, inferência estatística e
      processos estocásticos — a base de toda a econometria e das finanças.
    capitulos:
      - id: EST-G01
        titulo: "Probabilidade: axiomas, condicionamento e Bayes"
        nivel: G
        prereq: [MAT-G01]
        leituras: [degroot2012, bussab2017]
        topicos: ["Espaço amostral e eventos", "Axiomas de Kolmogorov", "Probabilidade condicional", "Independência", "Teorema de Bayes"]
      - id: EST-G02
        titulo: "Variáveis aleatórias e distribuições"
        nivel: G
        prereq: [EST-G01, MAT-G04]
        leituras: [degroot2012, casella2002]
        topicos: ["Variáveis discretas e contínuas", "Funções de distribuição e densidade", "Distribuições usuais", "Transformações de variáveis"]
      - id: EST-G03
        titulo: "Esperança, momentos e distribuições conjuntas"
        nivel: G
        prereq: [EST-G02, MAT-G06]
        leituras: [degroot2012, casella2002]
        topicos: ["Esperança e variância", "Distribuições conjuntas, marginais e condicionais", "Covariância e correlação", "Esperança condicional (versão elementar)", "Normal multivariada"]
      - id: EST-G04
        titulo: "Amostragem e teoremas-limite"
        nivel: G
        prereq: [EST-G03]
        leituras: [degroot2012, casella2002]
        topicos: ["Amostra aleatória e estatísticas", "Desigualdades de Markov e Chebyshev", "Lei dos grandes números", "Teorema central do limite", "Distribuições qui-quadrado, t e F"]
      - id: EST-G05
        titulo: "Estimação pontual e intervalar"
        nivel: G
        prereq: [EST-G04]
        leituras: [casella2002, bussab2017]
        topicos: ["Estimadores e suas propriedades", "Método dos momentos", "Máxima verossimilhança (introdução)", "Intervalos de confiança"]
      - id: EST-G06
        titulo: "Testes de hipóteses"
        nivel: G
        prereq: [EST-G05]
        leituras: [casella2002, bussab2017]
        topicos: ["Hipóteses, erros e poder", "Valor-p", "Testes para médias e proporções", "Relação entre testes e intervalos"]
      - id: EST-M01
        titulo: "Probabilidade com teoria da medida"
        nivel: M
        prereq: [EST-G03, MAT-M01]
        leituras: [billingsley1995, durrett2019]
        topicos: ["$\\sigma$-álgebras e medidas", "Funções mensuráveis", "Integral de Lebesgue", "Convergência monótona e dominada", "Fubini", "Radon–Nikodym"]
      - id: EST-M02
        titulo: "Esperança condicional"
        nivel: M
        prereq: [EST-M01]
        leituras: [durrett2019, billingsley1995]
        topicos: ["Definição via Radon–Nikodym", "Propriedades e lei das expectativas iteradas", "Esperança condicional como projeção em $L^2$", "Independência condicional"]
      - id: EST-M03
        titulo: "Modos de convergência e teoremas-limite"
        nivel: M
        prereq: [EST-M01]
        leituras: [durrett2019, hansen2022]
        topicos: ["Convergência quase certa, em probabilidade, em $L^p$ e em distribuição", "Teorema do mapeamento contínuo e Slutsky", "LGN forte e fraca", "TCL de Lindeberg–Lévy e Lindeberg–Feller", "Método delta"]
      - id: EST-M04
        titulo: "Inferência estatística: suficiência, verossimilhança e eficiência"
        nivel: M
        prereq: [EST-G05, EST-M03]
        leituras: [casella2002]
        topicos: ["Suficiência e fatoração", "Completude e Rao–Blackwell", "Informação de Fisher e Cramér–Rao", "Propriedades assintóticas do EMV"]
      - id: EST-M05
        titulo: "Testes ótimos e regiões de confiança"
        nivel: M
        prereq: [EST-M04]
        leituras: [casella2002]
        topicos: ["Lema de Neyman–Pearson", "Testes uniformemente mais poderosos", "Razão de verossimilhança", "Inversão de testes"]
      - id: EST-M06
        titulo: "Inferência bayesiana"
        nivel: M
        prereq: [EST-M04]
        leituras: [gelman2013, koop2003]
        topicos: ["Priori, verossimilhança e posteriori", "Famílias conjugadas", "Estimadores de Bayes e funções perda", "Intervalos de credibilidade", "Comparação de modelos e fator de Bayes"]
      - id: EST-D01
        titulo: "Cadeias de Markov"
        nivel: D
        prereq: [EST-G03, MAT-M02]
        leituras: [ljungqvist2018, durrett2019]
        topicos: ["Matriz de transição", "Distribuições estacionárias", "Irredutibilidade, aperiodicidade e ergodicidade", "Cadeias em espaço contínuo", "Aplicação: ciclos de negócios"]
      - id: EST-D02
        titulo: "Processos estacionários, ergodicidade e representação de Wold"
        nivel: D
        prereq: [EST-M03, MAT-D04]
        leituras: [hamilton1994, hansen2022]
        topicos: ["Estacionariedade forte e fraca", "Ergodicidade e LGN para dependência", "Processos lineares", "Teorema de Wold", "Densidade espectral"]
      - id: EST-D03
        titulo: "Martingais"
        nivel: D
        prereq: [EST-M02]
        leituras: [durrett2019, shreve2004]
        topicos: ["Filtrações e tempos de parada", "Martingais em tempo discreto", "Teorema da parada opcional", "Convergência de martingais", "TCL para diferenças de martingal"]
      - id: EST-D04
        titulo: "Movimento browniano e cálculo de Itô"
        nivel: D
        prereq: [EST-D03]
        leituras: [shreve2004, oksendal2003]
        topicos: ["Movimento browniano", "Integral de Itô", "Lema de Itô", "Equações diferenciais estocásticas", "Mudança de medida e Girsanov"]

  # ---------------------------------------------------------------------------
  - id: CMP
    titulo: "Computação"
    pasta: "03-computacao"
    descricao: >-
      Programação científica, dados e métodos numéricos — o que é preciso para
      que cada laboratório do livro rode, e para resolver modelos de verdade.
    capitulos:
      - id: CMP-G01
        titulo: "Python para economistas"
        nivel: G
        prereq: []
        leituras: [mckinney2022, quantecon]
        topicos: ["Tipos, controle de fluxo e funções", "NumPy e vetorização", "Matplotlib", "Boas práticas de código científico"]
      - id: CMP-G02
        titulo: "Dados: pandas, APIs públicas brasileiras e visualização"
        nivel: G
        prereq: [CMP-G01]
        leituras: [mckinney2022]
        topicos: ["Séries e DataFrames", "Datas, frequências e reamostragem", "APIs do BCB (SGS), IBGE (SIDRA) e Ipeadata", "Visualização de séries macroeconômicas"]
      - id: CMP-G03
        titulo: "Reprodutibilidade: Git, Quarto e ambientes"
        nivel: G
        prereq: [CMP-G01]
        leituras: [quantecon]
        topicos: ["Controle de versão com Git", "Documentos executáveis com Quarto", "Ambientes virtuais e dependências", "Organização de projetos de pesquisa"]
      - id: CMP-M01
        titulo: "Métodos numéricos I: raízes, otimização e diferenciação"
        nivel: M
        prereq: [CMP-G01, MAT-G07]
        leituras: [judd1998, miranda2002]
        topicos: ["Bisseção, Newton e quase-Newton", "Otimização sem derivadas", "Diferenciação numérica e automática", "Sistemas não lineares", "Condicionamento e erros de ponto flutuante"]
      - id: CMP-M02
        titulo: "Métodos numéricos II: integração, interpolação e aproximação"
        nivel: M
        prereq: [CMP-M01]
        leituras: [judd1998, miranda2002]
        topicos: ["Quadratura de Newton–Cotes e gaussiana", "Interpolação polinomial e splines", "Polinômios de Chebyshev", "Aproximação de funções"]
      - id: CMP-M03
        titulo: "Simulação e Monte Carlo"
        nivel: M
        prereq: [CMP-G01, EST-G04]
        leituras: [judd1998, quantecon]
        topicos: ["Geradores de números aleatórios", "Integração de Monte Carlo", "Redução de variância", "Desenho de experimentos de Monte Carlo em econometria"]
      - id: CMP-M04
        titulo: "Discretização de processos estocásticos"
        nivel: M
        prereq: [CMP-M03, EST-D01]
        leituras: [quantecon, heer2009]
        topicos: ["Método de Tauchen", "Método de Rouwenhorst", "Comparação de precisão", "Processos persistentes"]
      - id: CMP-D01
        titulo: "Solução de modelos dinâmicos: VFI, PFI e EGM"
        nivel: D
        prereq: [MAT-D03, CMP-M02]
        leituras: [heer2009, quantecon]
        topicos: ["Iteração da função valor", "Iteração da função política", "Método dos pontos endógenos (EGM)", "Precisão: erros na equação de Euler"]
      - id: CMP-D02
        titulo: "Métodos de perturbação e projeção"
        nivel: D
        prereq: [CMP-D01, MAT-M06]
        leituras: [fernandezvillaverde2016, judd1998]
        topicos: ["Linearização e solução de Blanchard–Kahn/Klein", "Perturbação de ordem superior", "Métodos de projeção e colocação", "Comparação de métodos"]
      - id: CMP-D03
        titulo: "Modelos de agentes heterogêneos: distribuição e equilíbrio"
        nivel: D
        prereq: [CMP-D01, MAC-D01]
        leituras: [auclert2021, heer2009]
        topicos: ["Método do histograma (Young)", "Equilíbrio estacionário", "Transições determinísticas", "Jacobianos no espaço de sequências"]
      - id: CMP-D04
        titulo: "Computação de alto desempenho"
        nivel: D
        prereq: [CMP-D01]
        leituras: [quantecon]
        topicos: ["Compilação JIT com Numba", "JAX e diferenciação automática", "Paralelização e GPU", "Perfilamento de código"]

  # ---------------------------------------------------------------------------
  - id: MIC
    titulo: "Microfundamentos"
    pasta: "04-microfundamentos"
    descricao: >-
      A microeconomia que a macro e as finanças pressupõem: escolha individual,
      incerteza, equilíbrio geral, jogos e informação.
    capitulos:
      - id: MIC-G01
        titulo: "Escolha do consumidor e demanda"
        nivel: G
        prereq: [MAT-G07]
        leituras: [varian2014]
        topicos: ["Preferências e utilidade", "Restrição orçamentária", "Demanda marshalliana", "Efeitos renda e substituição", "Excedente do consumidor"]
      - id: MIC-G02
        titulo: "Produção, custos e a firma"
        nivel: G
        prereq: [MAT-G07]
        leituras: [varian2014]
        topicos: ["Tecnologia e funções de produção", "Minimização de custos", "Maximização de lucro", "Curto e longo prazo"]
      - id: MIC-G03
        titulo: "Mercados competitivos e bem-estar"
        nivel: G
        prereq: [MIC-G01, MIC-G02]
        leituras: [varian2014]
        topicos: ["Equilíbrio parcial", "Eficiência e excedentes", "Caixa de Edgeworth", "Externalidades e bens públicos"]
      - id: MIC-G04
        titulo: "Escolha intertemporal"
        nivel: G
        prereq: [MIC-G01]
        leituras: [varian2014]
        topicos: ["Restrição orçamentária intertemporal", "Taxa de juros e poupança", "Modelo de Fisher", "Valor presente e decisões de investimento"]
      - id: MIC-G05
        titulo: "Introdução à teoria dos jogos"
        nivel: G
        prereq: [MIC-G01]
        leituras: [varian2014, osborne2020]
        topicos: ["Jogos na forma normal", "Equilíbrio de Nash", "Estratégias mistas", "Jogos sequenciais", "Oligopólio"]
      - id: MIC-M01
        titulo: "Teoria do consumidor"
        nivel: M
        prereq: [MIC-G01, MAT-M04]
        leituras: [mwg1995, jehle2011]
        topicos: ["Preferências e representação", "Utilidade indireta e função dispêndio", "Dualidade, Roy e Shephard", "Equação de Slutsky", "Agregação"]
      - id: MIC-M02
        titulo: "Escolha sob incerteza"
        nivel: M
        prereq: [MIC-M01, EST-G03]
        leituras: [mwg1995, gollier2001]
        topicos: ["Loterias e utilidade esperada", "Aversão ao risco: Arrow–Pratt", "Equivalente certo e prêmio de risco", "Dominância estocástica", "Poupança precaucional e prudência"]
      - id: MIC-M03
        titulo: "Equilíbrio geral e teoremas do bem-estar"
        nivel: M
