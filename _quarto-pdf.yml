# ARQUIVO GERADO por scripts/gerar_estrutura.py — edite curriculo.yml, não este arquivo
# Perfil pdf: apenas capítulos com status diferente de 'planejado'.
book:
  chapters:
  - index.qmd
  - part: partes/01-matematica/index.qmd
    chapters:
    - partes/01-matematica/mat-g01-logica-conjuntos-e-metodos-de-demonstracao.qmd
    - partes/01-matematica/mat-g02-numeros-reais-sequencias-e-series.qmd
    - partes/01-matematica/mat-g03-funcoes-de-uma-variavel-limites-continuidade-e-derivadas.qmd
    - partes/01-matematica/mat-g04-integracao-e-aplicacoes.qmd
    - partes/01-matematica/mat-g05-algebra-linear-i-vetores-matrizes-e-sistemas-lineares.qmd
    - partes/01-matematica/mat-g06-calculo-em-varias-variaveis.qmd
    - partes/01-matematica/mat-g07-otimizacao-sem-restricoes-e-com-restricoes-de-igualdade.qmd
    - partes/01-matematica/mat-g08-equacoes-em-diferencas-e-equacoes-diferenciais-lineares.qmd
    - partes/01-matematica/mat-m01-analise-real-em-r-n-e-espacos-metricos.qmd
    - partes/01-matematica/mat-m10-espacos-normados-e-com-produto-interno.qmd
  - part: partes/02-probabilidade-estatistica/index.qmd
    chapters:
    - partes/02-probabilidade-estatistica/est-g01-probabilidade-axiomas-condicionamento-e-bayes.qmd
    - partes/02-probabilidade-estatistica/est-g02-variaveis-aleatorias-e-distribuicoes.qmd
    - partes/02-probabilidade-estatistica/est-g03-esperanca-momentos-e-distribuicoes-conjuntas.qmd
    - partes/02-probabilidade-estatistica/est-g04-amostragem-e-teoremas-limite.qmd
    - partes/02-probabilidade-estatistica/est-g05-estimacao-pontual-e-intervalar.qmd
    - partes/02-probabilidade-estatistica/est-g06-testes-de-hipoteses.qmd
    - partes/02-probabilidade-estatistica/est-m01-probabilidade-com-teoria-da-medida.qmd
    - partes/02-probabilidade-estatistica/est-m02-esperanca-condicional.qmd
    - partes/02-probabilidade-estatistica/est-m03-modos-de-convergencia-e-teoremas-limite.qmd
    - partes/02-probabilidade-estatistica/est-m04-inferencia-estatistica-suficiencia-verossimilhanca-e.qmd
    - partes/02-probabilidade-estatistica/est-m05-testes-otimos-e-regioes-de-confianca.qmd
    - partes/02-probabilidade-estatistica/est-m06-inferencia-bayesiana.qmd
  - part: partes/05-econometria/index.qmd
    chapters:
    - partes/05-econometria/ecm-g01-regressao-linear-simples.qmd
  - referencias.qmd
  appendices:
  - apendices/notacao.qmd
  - apendices/guia-de-autoria.qmd
  - apendices/dados.qmd
  output-file: formacao-economia
project:
  output-dir: _pdf

# ---- formato (copiado de _formato-pdf.yml)
# Formato do PDF. Copiado para _quarto-pdf.yml por scripts/gerar_estrutura.py.
format:
  pdf:
    documentclass: scrbook
    classoption: [oneside, open=any, parskip=half, numbers=noenddot]
    papersize: a4
    fontsize: 11pt
    pdf-engine: xelatex
    toc-depth: 2
    toc-title: Sumário
    number-depth: 3
    colorlinks: true
    fig-format: pdf
    keep-tex: false
    filters:
      - filtros/refs-pendentes.lua
      - filtros/caixas-pdf.lua
    include-in-header:
      - file: tex/preambulo.tex
      - file: tex/macros.tex
