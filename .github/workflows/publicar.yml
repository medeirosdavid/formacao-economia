# Renderiza o site, o PDF e o baralho do Anki a cada push.
# • Sempre: o resultado fica disponível como artefato "livro" na página da execução
#   (aba Actions → execução → Artifacts), inclusive em repositório privado.
# • GitHub Pages (opcional): em Settings → Pages escolha "Source: GitHub Actions" e
#   crie a variável de repositório PUBLICAR_PAGES = true (Settings → Secrets and
#   variables → Actions → Variables). Em repositório privado, o Pages exige plano pago.
name: Publicar livro

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: livro
  cancel-in-progress: true

jobs:
  renderizar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Dependências Python
        run: pip install -r requirements.txt

      - uses: quarto-dev/quarto-actions/setup@v2
        with:
          tinytex: true

      - name: Estrutura (currículo → capítulos, perfis)
        run: python scripts/gerar_estrutura.py

      - name: Site
        run: quarto render

      - name: PDF
        run: quarto render --profile pdf --to pdf

      - name: Baralho do Anki
        run: python scripts/flashcards_anki.py

      - name: Junta PDF e Anki ao site
        run: |
          mkdir -p _book/pdf
          cp _pdf/formacao-economia.pdf _book/pdf/
          cp _anki/formacao-economia.apkg _book/ || true

      - name: Guarda o livro como artefato da execução
        uses: actions/upload-artifact@v4
        with:
          name: livro
          path: _book
          retention-days: 30

      - if: vars.PUBLICAR_PAGES == 'true'
        uses: actions/upload-pages-artifact@v3
        with:
          path: _book

  publicar:
    if: vars.PUBLICAR_PAGES == 'true'
    needs: renderizar
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - id: deploy
        uses: actions/deploy-pages@v4
